                  {METRIC_FIELDS.map((f) => (
                    <td key={f} className="px-2 py-2 text-center align-top">
                      <input
                        value={h.metrics?.[f] || ""}
                        onChange={(e) => updateMetric(h.id, f, e.target.value.replace(/[^0-9]/g, ""))}
                        placeholder="—"
                        className="w-12 text-center text-xs bg-white border border-slate-200 rounded px-1 py-1 text-slate-700 placeholder-slate-400 font-mono"
                      />
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

export default function ManagerSchedule() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [saving, setSaving] = useState(false);
  const [lastSynced, setLastSynced] = useState(null);
  const [tab, setTab] = useState("schedule");
  const [timelineDate, setTimelineDate] = useState(null);
  const [editing, setEditing] = useState(null); // {empId, date}
  const [copyToDates, setCopyToDates] = useState([]);
  const [addingEmp, setAddingEmp] = useState(false);
  const [newEmpName, setNewEmpName] = useState("");
  const [newEmpTeam, setNewEmpTeam] = useState("");
  const [addingDate, setAddingDate] = useState(false);
  const [newDate, setNewDate] = useState("");
  const [logTimeOff, setLogTimeOff] = useState(null); // empId
  const [logPickerEmp, setLogPickerEmp] = useState("");
  const [logDate, setLogDate] = useState("");
  const [logType, setLogType] = useState("PTO");
  const [logScope, setLogScope] = useState("allday");
  const [logStart, setLogStart] = useState("09:00");
  const [logEnd, setLogEnd] = useState("17:00");
  const [logHours, setLogHours] = useState("8");
  const [logCoveredBy, setLogCoveredBy] = useState("");
  const [newTdEmp, setNewTdEmp] = useState("");
  const [newTdDate, setNewTdDate] = useState("");
  const [newTdLabel, setNewTdLabel] = useState("Approved");
  const [timeOffView, setTimeOffView] = useState("grid"); // 'dates' | 'grid'
  const [showPastList, setShowPastList] = useState(false);
  const [showPastGrid, setShowPastGrid] = useState(false);
  const [holidayView, setHolidayView] = useState("table"); // 'table' | 'cards'
  const [undoStack, setUndoStack] = useState([]); // snapshots of `data` from right before each change, most recent last
  const [checkingLock, setCheckingLock] = useState(true);
  const [unlocked, setUnlocked] = useState(false);
  const [passcodeInput, setPasscodeInput] = useState("");
  const [passcodeError, setPasscodeError] = useState(false);
  const [lockoutUntil, setLockoutUntil] = useState(0);
  const [lockoutRemaining, setLockoutRemaining] = useState(0);
  const [entryChoice, setEntryChoice] = useState(null); // null | 'manager' | 'employee' — which form the chooser screen shows
  const [empSelectedId, setEmpSelectedId] = useState(null);
  const [empPinInput, setEmpPinInput] = useState("");
  const [empPinError, setEmpPinError] = useState(false);
  const modalOpenRef = useRef(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storage.get(UNLOCK_KEY, false);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          if (parsed && parsed.at && Date.now() - parsed.at < UNLOCK_TTL_MS) setUnlocked(true);
        }
      } catch (e) {
        // Not unlocked on this device/account yet — that's the normal case, not an error.
      }
      try {
        const saved = await storage.get(ME_KEY, false);
        if (saved && saved.value) {
          const parsed = JSON.parse(saved.value);
          if (parsed && parsed.id && parsed.at && Date.now() - parsed.at < UNLOCK_TTL_MS) setEmpSelectedId(parsed.id);
        }
      } catch (e) {
        // No saved employee sign-in yet — normal case.
      }
      try {
        const lock = await storage.get(LOCKOUT_KEY, false);
        if (lock && lock.value) {
          const parsed = JSON.parse(lock.value);
          if (parsed && parsed.until && parsed.until > Date.now()) setLockoutUntil(parsed.until);
        }
      } catch (e) {
        // No lockout on record — normal case.
      } finally {
        setCheckingLock(false);
      }
    })();
  }, []);

  // Live countdown while locked out, so the passcode screen shows "try again in Ns" ticking down
  // instead of just staying disabled with no explanation.
  useEffect(() => {
    if (!lockoutUntil) { setLockoutRemaining(0); return; }
    const tick = () => setLockoutRemaining(Math.max(0, Math.ceil((lockoutUntil - Date.now()) / 1000)));
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, [lockoutUntil]);

  const tryUnlock = async () => {
    if (lockoutUntil > Date.now()) return;
    const hash = await sha256Hex(passcodeInput);
    if (hash === MANAGER_PASSCODE_HASH) {
      setUnlocked(true);
      setPasscodeError(false);
      setLockoutUntil(0);
      try {
        await storage.set(UNLOCK_KEY, JSON.stringify({ at: Date.now() }), false);
        await storage.delete(LOCKOUT_KEY, false);
      } catch (e) {}
    } else {
      setPasscodeError(true);
      try {
        const lock = await storage.get(LOCKOUT_KEY, false);
        const prev = lock && lock.value ? JSON.parse(lock.value) : { fails: 0 };
        const fails = (prev.fails || 0) + 1;
        let until = 0;
        if (fails >= LOCKOUT_THRESHOLD) {
          // Escalating cooldown: 30s, 60s, 120s, 240s... the more wrong guesses, the longer the wait.
          const tier = fails - LOCKOUT_THRESHOLD;
          const seconds = Math.min(30 * Math.pow(2, tier), 3600);
          until = Date.now() + seconds * 1000;
          setLockoutUntil(until);
          // Log it into the shared data too, so any manager opening the tool later can see that
          // someone got locked out — this can't push a notification to you, but it does leave
          // a real, visible record instead of failing silently.
          if (data) {
            try {
              const nextLog = [...(data.securityLog || []), { at: Date.now(), fails }].slice(-50);
              persist({ ...data, securityLog: nextLog, updatedAt: Date.now() });
            } catch (e) {}
          }
        }
        await storage.set(LOCKOUT_KEY, JSON.stringify({ fails, until }), false);
      } catch (e) {}
    }
  };

  const lockAgain = async () => {
    setUnlocked(false);
    setPasscodeInput("");
    try { await storage.delete(UNLOCK_KEY, false); } catch (e) {}
  };

  const tryEmployeeSignIn = async () => {
    if (!data) return;
    const match = (data.employees || []).find((e) => e.pin && e.pin === empPinInput);
    if (match) {
      setEmpSelectedId(match.id);
      setEmpPinError(false);
      setEmpPinInput("");
      try { await storage.set(ME_KEY, JSON.stringify({ id: match.id, at: Date.now() }), false); } catch (e) {}
    } else {
      setEmpPinError(true);
    }
  };

  const employeeSignOut = async () => {
    setEmpSelectedId(null);
    setEmpPinInput("");
    setEntryChoice(null);
    try { await storage.delete(ME_KEY, false); } catch (e) {}
  };


  const load = useCallback(async (isPoll) => {
    try {
      const res = await storage.get(STORAGE_KEY, true);
      if (res && res.value) {
        let parsed = normalizeData(JSON.parse(res.value));
        if (!isPoll) {
          const pruned = pruneOldDatesOnTuesday(parsed);
          parsed = pruned.data;
          const filled = ensureAutoDates(parsed);
          parsed = filled.data;
          const pinned = ensureEmployeePins(parsed);
          parsed = pinned.data;
          const emailed = ensureEmployeeEmails(parsed);
          parsed = emailed.data;
          const exempted = ensureTicketsExemptDefaults(parsed);
          parsed = exempted.data;
          const qaMonthly = ensureQaEvalMonthly(parsed);
          parsed = qaMonthly.data;
          if (pruned.changed || filled.changed || pinned.changed || emailed.changed || exempted.changed || qaMonthly.changed) await storage.set(STORAGE_KEY, JSON.stringify(parsed), true);
        }
        setData(parsed);
      } else if (!isPoll) {
        let seeded = normalizeData({ ...SEED, updatedAt: Date.now() });
        seeded = ensureAutoDates(seeded).data;
        seeded = ensureEmployeePins(seeded).data;
        seeded = ensureEmployeeEmails(seeded).data;
        seeded = ensureTicketsExemptDefaults(seeded).data;
        setData(seeded);
        await storage.set(STORAGE_KEY, JSON.stringify(seeded), true);
      }
      setLastSynced(Date.now());
      setError(null);
    } catch (e) {
      if (!isPoll) {
        setData(normalizeData({ ...SEED, updatedAt: Date.now() }));
        setError("Couldn't reach shared storage — showing local seed data. Changes may not save.");
      }
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { load(false); }, [load]);
  useEffect(() => { setCopyToDates([]); }, [editing]);

  useEffect(() => {
    const id = setInterval(() => {
      if (!modalOpenRef.current) load(true);
    }, POLL_MS);
    return () => clearInterval(id);
  }, [load]);

  useEffect(() => { modalOpenRef.current = !!editing || addingEmp || addingDate || !!logTimeOff; }, [editing, addingEmp, addingDate, logTimeOff]);

  const UNDO_LIMIT = 20;

  const persist = async (next) => {
    setUndoStack((stack) => [...stack, data].slice(-UNDO_LIMIT));
    setData(next);
    setSaving(true);
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(next), true);
      setLastSynced(Date.now());
      setError(null);
    } catch (e) {
      setError("Save failed — check your connection and try again.");
    } finally {
      setSaving(false);
    }
  };

  const undo = async () => {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    setUndoStack((stack) => stack.slice(0, -1));
    setData(prev);
    setSaving(true);
    try {
      await storage.set(STORAGE_KEY, JSON.stringify(prev), true);
      setLastSynced(Date.now());
      setError(null);
    } catch (e) {
      setError("Save failed — check your connection and try again.");
    } finally {
      setSaving(false);
    }
  };

  if (checkingLock) {
    return <LoadingScreen />;
  }

  if (!unlocked && !empSelectedId) {
    if (entryChoice === "manager") {
      return (
        <div className="min-h-screen bg-white flex items-center justify-center p-4" style={{ fontFamily: "'Inter', sans-serif" }}>
          <FontImport />
          <div className="w-full max-w-xs">
            <div className="flex justify-center mb-4"><TomorrowHealthLogo size={36} color={TH.navy} /></div>
            <h1 className="text-sm font-semibold text-center mb-1" style={{ color: TH.navy }}>Manager access</h1>
            <p className="text-xs text-slate-500 text-center mb-4">Enter the passcode to continue.</p>
            <input
              type="password"
              autoFocus
              disabled={lockoutRemaining > 0}
              value={passcodeInput}
              onChange={(e) => { setPasscodeInput(e.target.value); setPasscodeError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryUnlock()}
              placeholder="Passcode"
              className={`w-full text-center bg-white border rounded px-3 py-2 text-sm text-slate-900 mb-2 disabled:bg-slate-100 disabled:text-slate-400 ${passcodeError ? "border-rose-400" : "border-slate-300"}`}
            />
            {lockoutRemaining > 0 ? (
              <p className="text-xs text-rose-600 text-center mb-2">Too many attempts — try again in {lockoutRemaining}s.</p>
            ) : (
              passcodeError && <p className="text-xs text-rose-600 text-center mb-2">That's not it — try again.</p>
            )}
            <button
              onClick={tryUnlock}
              disabled={lockoutRemaining > 0}
              className="th-btn-primary transition-colors w-full text-sm px-3 py-2 rounded text-white font-medium mb-2 disabled:opacity-40 disabled:cursor-not-allowed"
            >
              Unlock
            </button>
            <button onClick={() => { setEntryChoice(null); setPasscodeInput(""); setPasscodeError(false); }} className="w-full text-xs text-slate-500 hover:text-slate-700">
              ‹ Back
            </button>
          </div>
        </div>
      );
    }

    if (entryChoice === "employee") {
      return (
        <div className="min-h-screen bg-white flex items-center justify-center p-4" style={{ fontFamily: "'Inter', sans-serif" }}>
          <FontImport />
          <div className="w-full max-w-xs">
            <div className="flex justify-center mb-4"><TomorrowHealthLogo size={36} color={TH.navy} /></div>
            <h1 className="text-sm font-semibold text-center mb-1" style={{ color: TH.navy }}>My Schedule</h1>
            <p className="text-xs text-slate-500 text-center mb-4">Enter the code your manager gave you to see your own shifts.</p>
            <input
              type="password"
              inputMode="numeric"
              autoFocus
              value={empPinInput}
              onChange={(e) => { setEmpPinInput(e.target.value.replace(/[^0-9]/g, "").slice(0, 4)); setEmpPinError(false); }}
              onKeyDown={(e) => e.key === "Enter" && tryEmployeeSignIn()}
              placeholder="Your code"
              className={`w-full text-center bg-white border rounded px-3 py-2 text-sm text-slate-900 mb-2 ${empPinError ? "border-rose-400" : "border-slate-300"}`}
            />
            {empPinError && <p className="text-xs text-rose-600 text-center mb-2">That code doesn't match anyone — check with your manager.</p>}
            {loading && <p className="text-xs text-slate-400 text-center mb-2">Still loading — try again in a moment if this doesn't work yet.</p>}
            <button onClick={tryEmployeeSignIn} className="w-full text-sm px-3 py-2 rounded text-white font-medium mb-2" style={{ backgroundColor: TH.teal }}>
              View my schedule
            </button>
            <button onClick={() => { setEntryChoice(null); setEmpPinInput(""); setEmpPinError(false); }} className="w-full text-xs text-slate-500 hover:text-slate-700">
              ‹ Back
            </button>
          </div>
        </div>
      );
    }

    return (
      <div className="min-h-screen bg-white flex items-center justify-center p-4" style={{ fontFamily: "'Inter', sans-serif" }}>
        <FontImport />
        <div className="w-full max-w-xs text-center">
          <div className="flex justify-center mb-4"><TomorrowHealthLogo size={36} color={TH.navy} /></div>
          <h1 className="text-sm font-semibold mb-1" style={{ color: TH.navy }}>Tomorrow Health</h1>
          <p className="text-xs text-slate-500 mb-6">Who's signing in?</p>
          <button onClick={() => setEntryChoice("manager")} className="th-btn-primary transition-colors w-full text-sm px-3 py-2.5 rounded text-white font-medium mb-2">
            I'm a manager
          </button>
          <button onClick={() => setEntryChoice("employee")} className="w-full text-sm px-3 py-2.5 rounded border border-slate-300 text-slate-700 hover:border-teal-500 hover:text-teal-700 font-medium">
            I'm on the team
          </button>
        </div>
      </div>
    );
  }

  if (loading) {
    return <LoadingScreen />;
  }

  const { employees: employeesRaw, cells, timeOff = {}, holidays = [] } = data;
  const employees = [...employeesRaw].sort((a, b) => a.name.localeCompare(b.name));

  // Date -> Set of distinct employee ids with a logged time-off entry that date.
  // Built from the full (append-only) timeOffDates history, so past and upcoming entries both count.
  const tdPeopleByDate = {};
  (data.timeOffDates || []).forEach((entry) => {
    if (!tdPeopleByDate[entry.date]) tdPeopleByDate[entry.date] = new Set();
    tdPeopleByDate[entry.date].add(entry.empId);
  });
  const todayISO = new Date().toISOString().slice(0, 10);
  // Always show this week + next week (including weekends) as columns, even if storage
  // hasn't finished persisting them yet — actual add/remove still operates on data.dates.
  const dates = Array.from(new Set([...(data.dates || []), ...autoRequiredDates()])).sort();

  if (!unlocked && empSelectedId) {
    return (
      <EmployeeView
        employees={employees}
        cells={cells}
        dates={dates}
        meId={empSelectedId}
        onSignOut={employeeSignOut}
        lastSynced={lastSynced}
        offline={!!error}
      />
    );
  }

  // Known skills library plus any clean custom ones already used in the schedule.
  // Filters out leftover fragments from the old data (e.g. "IB-AM", "OOO-PM", trailing-space "Project ")
  // so the picker only ever shows tidy, canonical skill names.
  const isCleanSkillName = (raw) => {
    const trimmed = raw.trim();
    if (!trimmed || trimmed !== raw) return false; // stray leading/trailing whitespace
    if (/\d/.test(trimmed)) return false; // any digit means it's a leftover time fragment, not a real skill
    if (!/[a-zA-Z]{2,}/.test(trimmed)) return false; // must contain an actual word
    if (/(^|[\s-])(am|pm)($|[\s-])/i.test(trimmed)) return false; // "IB-AM", "OOO - PM", etc.
    if (/\b(til|until|returns?|starts?|ends?)\b/i.test(trimmed)) return false; // sentence-fragment leftovers
    if (/^coms?\b/i.test(trimmed) && trimmed.toLowerCase() !== "coms") return false; // "COM GHP", "COMs GHP" — handled via the payer sub-selection, not a separate skill
    if (/^project\s+\w+/i.test(trimmed)) return false; // "Project Time" etc — dupe of "Project"
    const normalized = trimmed.toLowerCase().replace(/[\s-]+/g, "");
    if (FUNCTION_LIBRARY.some((f) => f.toLowerCase().replace(/[\s-]+/g, "") === normalized)) return false; // dupe of a library entry
    return true;
  };
  const usedTaskNames = new Set();
  Object.values(cells).forEach((c) => (c.tasks || []).forEach((t) => t.name && usedTaskNames.add(t.name)));
  const cleanCustomNames = Array.from(usedTaskNames).filter(isCleanSkillName);
  const functionOptions = Array.from(new Set([...FUNCTION_LIBRARY, ...cleanCustomNames])).sort((a, b) =>
    FUNCTION_LIBRARY.includes(a) === FUNCTION_LIBRARY.includes(b) ? a.localeCompare(b) : FUNCTION_LIBRARY.includes(a) ? -1 : 1
  );

  const coverageStats = (date, team) => {
    const pool = team ? employees.filter((e) => e.team === team) : employees;
    const total = pool.length || 1;
    const working = pool.filter((e) => (cells[cellKey(e.id, date)]?.status || "") === "").length;
    const ooo = total - working;
    return {
      working,
      ooo,
      total: pool.length,
      coveragePct: Math.round((working / total) * 100),
      oooPct: Math.round((ooo / total) * 100),
    };
  };

  // Minimal weekend check: covered if anyone's shift spans the full 8:00–17:30 window
  const weekendCoverage = (date) => {
    const need = { start: toMinutes("08:00"), end: toMinutes("17:30") };
    const covered = employees.some((e) => {
      const c = cells[cellKey(e.id, date)];
      if (!c || c.status) return false;
      const s = toMinutes(c.shiftStart), en = toMinutes(c.shiftEnd);
      return s !== null && en !== null && s <= need.start && en >= need.end;
    });
    return covered;
  };

  const ibCoverageStats = (date, team) => {
    const pool = team ? employees.filter((e) => e.team === team) : employees;
    const total = pool.length || 1;
    const onIb = pool.filter((e) => {
      const c = cells[cellKey(e.id, date)];
      return c && !c.status && (c.tasks || []).some((t) => t.name.trim().toUpperCase() === "IB");
    }).length;
    return { onIb, total: pool.length, ibPct: Math.round((onIb / total) * 100) };
  };

  const updateCell = (empId, date, patch) => {
    const key = cellKey(empId, date);
    const next = {
      ...data,
      cells: { ...cells, [key]: { ...(cells[key] || emptyCell()), ...patch } },
      updatedAt: Date.now(),
    };
    persist(next);
  };

  // Saves a new block list for a day AND, in the same write, boils it down into the legacy
  // status/shiftStart/etc. fields — so Team Overview, coverage stats, the employee's own view,
  // and time-off sync all keep reading data that's actually current, with no separate sync step.
  const updateBlocks = (empId, date, newBlocks) => {
    updateCell(empId, date, { blocks: newBlocks, ...deriveLegacyFieldsFromBlocks(newBlocks) });
  };

  // Adding several tasks at once (multi-select in TaskBuilder) must go through ONE persist
  // call — calling this in a loop per task would have each call read the same stale `cells`
  // closure, so only the last task actually stuck. This is that fix — always call it with
  // the full array of tasks to add, even if that array has just one item.
  const addTasks = (empId, date, newTasks) => {
    if (!newTasks.length) return;
    const key = cellKey(empId, date);
    const current = cells[key] || emptyCell();
    updateCell(empId, date, { tasks: [...current.tasks, ...newTasks] });
  };

  const removeTask = (empId, date, taskId) => {
    const key = cellKey(empId, date);
    const current = cells[key] || emptyCell();
    updateCell(empId, date, { tasks: current.tasks.filter((t) => t.id !== taskId) });
  };

  const copyCellToDates = (empId, sourceDate, targetDates) => {
    const sourceCell = cells[cellKey(empId, sourceDate)] || emptyCell();
    const nextCells = { ...cells };
    targetDates.forEach((d) => {
      nextCells[cellKey(empId, d)] = {
        ...sourceCell,
        tasks: sourceCell.tasks.map((t) => ({ ...t })),
        blocks: Array.isArray(sourceCell.blocks) ? sourceCell.blocks.map((b) => ({ ...b })) : sourceCell.blocks,
      };
    });
    persist({ ...data, cells: nextCells, updatedAt: Date.now() });
  };

  const updateEmployee = (empId, field, value) => {
    const nextEmployees = employees.map((e) => e.id === empId ? { ...e, [field]: value } : e);
    persist({ ...data, employees: nextEmployees, updatedAt: Date.now() });
  };

  const regeneratePin = (empId) => {
    const used = new Set(employees.filter((e) => e.id !== empId && e.pin).map((e) => e.pin));
    let pin;
    do { pin = String(Math.floor(1000 + Math.random() * 9000)); } while (used.has(pin));
    updateEmployee(empId, "pin", pin);
  };

  // A guaranteed, on-demand fallback for the automatic pin migration — assigns a code to
  // anyone missing one (their default code if we have one on file, otherwise a fresh random
  // one), all in a single persist call so nothing overwrites anything else.
  const fillMissingPins = () => {
    const used = new Set(employees.filter((e) => e.pin).map((e) => e.pin));
    let changed = false;
    const nextEmployees = employees.map((e) => {
      if (e.pin) return e;
      changed = true;
      let pin = DEFAULT_PINS[e.id];
      if (!pin || used.has(pin)) {
        do { pin = String(Math.floor(1000 + Math.random() * 9000)); } while (used.has(pin));
      }
      used.add(pin);
      return { ...e, pin };
    });
    if (!changed) return;
    persist({ ...data, employees: nextEmployees, updatedAt: Date.now() });
  };

  const clearSecurityLog = () => {
    persist({ ...data, securityLog: [], updatedAt: Date.now() });
  };

  const addEmployee = () => {
    if (!newEmpName.trim()) return;
    const id = newEmpName.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-");
    if (employees.some((e) => e.id === id)) { setAddingEmp(false); return; }
    const used = new Set(employees.filter((e) => e.pin).map((e) => e.pin));
    let pin;
    do { pin = String(Math.floor(1000 + Math.random() * 9000)); } while (used.has(pin));
    const next = {
      ...data,
      employees: [...employees, { id, name: newEmpName.trim(), team: newEmpTeam.trim(), pin }],
      updatedAt: Date.now(),
    };
    persist(next);
    setNewEmpName(""); setNewEmpTeam(""); setAddingEmp(false);
  };

  const removeEmployee = (empId) => {
    const nextCells = { ...cells };
    dates.forEach((d) => delete nextCells[cellKey(empId, d)]);
    const nextTimeOff = { ...timeOff };
    delete nextTimeOff[empId];
    const nextQaEvals = { ...(data.qaEvals || {}) };
    delete nextQaEvals[empId];
    const nextPtoNotes = { ...(data.ptoEvalNotes || {}) };
    delete nextPtoNotes[empId];
    const nextTimeOffDates = (data.timeOffDates || []).filter((td) => td.empId !== empId);
    persist({
      ...data,
      employees: employees.filter((e) => e.id !== empId),
      cells: nextCells,
      timeOff: nextTimeOff,
      qaEvals: nextQaEvals,
      ptoEvalNotes: nextPtoNotes,
      timeOffDates: nextTimeOffDates,
      updatedAt: Date.now(),
    });
  };

  const addDateTo = (dataObj, date) => {
    if (!date || dataObj.dates.includes(date)) return dataObj;
    return { ...dataObj, dates: [...dataObj.dates, date].sort() };
  };

  const addDate = () => {
    if (!newDate || dates.includes(newDate)) { setAddingDate(false); return; }
    persist({ ...addDateTo(data, newDate), updatedAt: Date.now() });
    setNewDate(""); setAddingDate(false);
  };

  const removeDate = (date) => {
    const nextCells = { ...cells };
    employees.forEach((e) => delete nextCells[cellKey(e.id, date)]);
    persist({ ...data, dates: dates.filter((d) => d !== date), cells: nextCells, updatedAt: Date.now() });
  };

  const updateTimeOff = (empId, field, value) => {
    const current = timeOff[empId] || { allPto: 0, allSick: 0, pastPto: 0, pastSick: 0, upcomingPto: 0, upcomingSick: 0 };
    const num = value === "" ? 0 : parseFloat(value);
    persist({ ...data, timeOff: { ...timeOff, [empId]: { ...current, [field]: isNaN(num) ? 0 : num } }, updatedAt: Date.now() });
  };

  const updatePtoNote = (empId, text) => {
    persist({ ...data, ptoEvalNotes: { ...(data.ptoEvalNotes || {}), [empId]: text }, updatedAt: Date.now() });
  };

  const updateQaEval = (empId, monthKey, field, value) => {
    const empMonths = data.qaEvals?.[empId] || {};
    const current = empMonths[monthKey] || {};
    persist({
      ...data,
      qaEvals: { ...(data.qaEvals || {}), [empId]: { ...empMonths, [monthKey]: { ...current, [field]: value } } },
      updatedAt: Date.now(),
    });
  };

  // Merge several fields for several employees into ONE month in ONE persist call — calling
  // updateQaEval repeatedly in a loop would have each call read the same stale `data`, so only
  // the last field written would actually stick. Used by the CSV-generate flow.
  const updateQaEvalBatch = (monthKey, patchesByEmpId) => {
    const nextQaEvals = { ...(data.qaEvals || {}) };
    Object.entries(patchesByEmpId).forEach(([empId, patch]) => {
      const empMonths = nextQaEvals[empId] || {};
      nextQaEvals[empId] = { ...empMonths, [monthKey]: { ...(empMonths[monthKey] || {}), ...patch } };
    });
    persist({ ...data, qaEvals: nextQaEvals, updatedAt: Date.now() });
  };

  const addTimeOffDate = (entry) => {
    const nextCells = { ...cells };
    const mappedStatus = TIMEOFF_LABEL_TO_STATUS[entry.label];
    if (mappedStatus) {
      const key = cellKey(entry.empId, entry.date);
      const current = nextCells[key] || emptyCell();
      nextCells[key] = { ...current, status: mappedStatus, statusScope: "allday", statusStart: "", statusEnd: "" };
    }
    persist({ ...data, timeOffDates: [...(data.timeOffDates || []), entry], cells: nextCells, updatedAt: Date.now() });
  };

  const removeTimeOffDate = (entryId) => {
    const entry = (data.timeOffDates || []).find((e) => e.id === entryId);
    const nextCells = { ...cells };
    if (entry) {
      const key = cellKey(entry.empId, entry.date);
      const current = nextCells[key];
      // Only clear the Schedule status if it's still the value this Time Off entry set —
      // if a manager changed it to something else on the Schedule side since, leave it alone.
      if (current && TIMEOFF_SYNCED_STATUS_VALUES.includes(current.status) && current.status === TIMEOFF_LABEL_TO_STATUS[entry.label]) {
        nextCells[key] = { ...current, status: "" };
      }
    }
    persist({ ...data, timeOffDates: (data.timeOffDates || []).filter((e) => e.id !== entryId), cells: nextCells, updatedAt: Date.now() });
  };

  const setTimeOffCell = (empId, date, label) => {
    const list = data.timeOffDates || [];
    const existing = list.find((e) => e.empId === empId && e.date === date);
    let next;
    if (!label) {
      next = list.filter((e) => !(e.empId === empId && e.date === date));
    } else if (existing) {
      next = list.map((e) => (e.empId === empId && e.date === date) ? { ...e, label } : e);
    } else {
      next = [...list, { id: `td${Date.now()}`, empId, date, label }];
    }

    const nextCells = { ...cells };
    const key = cellKey(empId, date);
    const mappedStatus = label ? TIMEOFF_LABEL_TO_STATUS[label] : null;
    if (mappedStatus) {
      const current = nextCells[key] || emptyCell();
      nextCells[key] = { ...current, status: mappedStatus, statusScope: "allday", statusStart: "", statusEnd: "" };
    } else if (!label) {
      // Cleared back to "—" in the Time Off tab — clear the Schedule status too, but only if
      // it's still one of the values a Time Off label would have set.
      const current = nextCells[key];
      if (current && TIMEOFF_SYNCED_STATUS_VALUES.includes(current.status)) {
        nextCells[key] = { ...current, status: "" };
      }
    }

    persist({ ...data, timeOffDates: next, cells: nextCells, updatedAt: Date.now() });
  };

  const submitLogTimeOff = () => {
    if (!logTimeOff || !logDate) return;
    let next = addDateTo(data, logDate);
    const key = cellKey(logTimeOff, logDate);
    const hours = logScope === "partial" ? hoursBetween(logStart, logEnd) : (logHours === "" ? "" : logHours);
    next = {
      ...next,
      cells: {
        ...next.cells,
        [key]: {
          tasks: [], status: logType,
          statusScope: logScope, statusStart: logScope === "partial" ? logStart : "", statusEnd: logScope === "partial" ? logEnd : "",
          shiftStart: "", shiftEnd: "", hours, coveredBy: logCoveredBy,
        },
      },
      updatedAt: Date.now(),
    };

    // Deduct from the upcoming balance for PTO/Sick, in day-equivalents (8h = 1 day)
    if ((logType === "PTO" || logType === "Sick") && hours) {
      const days = parseFloat(hours) / 8;
      if (!isNaN(days) && days > 0) {
        const current = next.timeOff[logTimeOff] || { allPto: 0, allSick: 0, pastPto: 0, pastSick: 0, upcomingPto: 0, upcomingSick: 0 };
        const field = logType === "PTO" ? "upcomingPto" : "upcomingSick";
        const updated = Math.max(0, Math.round((current[field] - days) * 100) / 100);
        next = { ...next, timeOff: { ...next.timeOff, [logTimeOff]: { ...current, [field]: updated } } };
      }
    }

    // Keep the chronological "who's out and when" list in sync with what's logged here
    next = { ...next, timeOffDates: [...(next.timeOffDates || []), { id: `td${Date.now()}`, empId: logTimeOff, date: logDate, label: logType }] };

    persist(next);
    setLogTimeOff(null); setLogDate(""); setLogType("PTO"); setLogScope("allday"); setLogStart("09:00"); setLogEnd("17:00"); setLogHours("8"); setLogCoveredBy(""); setLogPickerEmp("");
  };

  const updateHolidayField = (holidayId, field, value) => {
    const nextHolidays = holidays.map((h) => h.id === holidayId ? { ...h, [field]: value } : h);
    persist({ ...data, holidays: nextHolidays, updatedAt: Date.now() });
  };

  const updateMetric = (holidayId, field, value) => {
    const nextHolidays = holidays.map((h) => h.id === holidayId ? { ...h, metrics: { ...h.metrics, [field]: value } } : h);
    persist({ ...data, holidays: nextHolidays, updatedAt: Date.now() });
  };

  const addVolunteer = (holidayId, volunteer) => {
    const nextHolidays = holidays.map((h) => h.id === holidayId ? { ...h, volunteers: [...(h.volunteers || []), volunteer] } : h);
    persist({ ...data, holidays: nextHolidays, updatedAt: Date.now() });
  };

  const removeVolunteer = (holidayId, volunteerId) => {
    const nextHolidays = holidays.map((h) => h.id === holidayId ? { ...h, volunteers: (h.volunteers || []).filter((v) => v.id !== volunteerId) } : h);
    persist({ ...data, holidays: nextHolidays, updatedAt: Date.now() });
  };

  const updateVolunteer = (holidayId, volunteerId, field, value) => {
    const nextHolidays = holidays.map((h) => h.id === holidayId ? { ...h, volunteers: (h.volunteers || []).map((v) => v.id === volunteerId ? { ...v, [field]: value } : v) } : h);
    persist({ ...data, holidays: nextHolidays, updatedAt: Date.now() });
  };

  const editEmp = editing ? employees.find((e) => e.id === editing.empId) : null;
  const editCell = editing ? (() => {
    const raw = cells[cellKey(editing.empId, editing.date)] || emptyCell();
    return { ...raw, blocks: getCellBlocks(raw, editEmp?.shiftStart, editEmp?.shiftEnd) };
  })() : null;

  return (
    <div className="min-h-screen bg-white" style={{ color: TH.text, fontFamily: "'Inter', sans-serif" }}>
      <FontImport />
      {/* Header */}
      <div className="sticky top-0 z-30 bg-white">
        <div className="px-4 sm:px-6 pt-2.5 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2">
            <TomorrowHealthLogo size={22} color={TH.navy} />
            <span className="font-bold text-sm tracking-tight" style={{ color: TH.navy }}>Tomorrow Health</span>
            <span className="text-xs font-semibold" style={{ color: TH.tealDark }}>CX Motherboard</span>
          </div>
          <div className="flex items-center gap-3 text-[11px] font-medium" style={{ color: TH.textMuted }}>
            <button
              onClick={undo}
              disabled={undoStack.length === 0}
              className="flex items-center gap-1 hover:text-slate-700 disabled:opacity-30 disabled:cursor-not-allowed"
              title={undoStack.length ? `Undo last change (${undoStack.length} available this session)` : "Nothing to undo yet"}
            >
              <Undo2 className="w-3.5 h-3.5" />
            </button>
            <button onClick={lockAgain} className="flex items-center gap-1 hover:text-slate-700" title="Lock this view">
              <Lock className="w-3.5 h-3.5" />
            </button>
            <span className="flex items-center gap-2">
              <span className={`w-1.5 h-1.5 rounded-full ${saving ? "bg-amber-400 animate-pulse" : ""}`} style={!saving ? { backgroundColor: TH.teal } : {}} />
              {saving ? "saving…" : `synced ${timeAgo(lastSynced)}`}
            </span>
          </div>
        </div>
        {error && (
          <div className="px-4 sm:px-6 py-1.5 mt-1.5 flex items-center gap-2 text-amber-800 text-xs bg-amber-50">
            <AlertCircle className="w-3.5 h-3.5" /> {error}
          </div>
        )}
        <div className="px-4 sm:px-6 pt-2 flex flex-wrap gap-1">
          {TABS.map((t) => {
            const Icon = t.icon;
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full transition-colors font-semibold"
                style={active ? { backgroundColor: TH.navy, color: "#fff" } : { backgroundColor: "transparent", color: TH.textMid }}
              >
                <Icon className="w-3.5 h-3.5" /> {t.label}
              </button>
            );
          })}
        </div>
        <div className="h-[3px] mt-1.5" style={{ background: `linear-gradient(90deg, ${TH.teal}, ${TH.blue})` }} />
      </div>

      {tab === "roster" && (
        <RosterTab employees={employees} teamColor={teamColor} updateEmployee={updateEmployee} removeEmployee={removeEmployee} setAddingEmp={setAddingEmp} regeneratePin={regeneratePin} fillMissingPins={fillMissingPins} securityLog={data.securityLog || []} clearSecurityLog={clearSecurityLog} />
      )}

      {tab === "schedule" && (
        <>
          <div className="px-4 sm:px-6 py-3 flex flex-wrap items-center gap-2 border-b" style={{ borderColor: TH.border }}>
            <button
              onClick={() => setAddingEmp(true)}
              className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border transition-colors"
              style={{ borderColor: TH.border, color: TH.textMid }}
            >
              <Plus className="w-3.5 h-3.5" /> Add employee
            </button>
            <button
              onClick={() => setAddingDate(true)}
              className="flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-full border transition-colors"
              style={{ borderColor: TH.border, color: TH.textMid }}
            >
              <CalendarPlus className="w-3.5 h-3.5" /> Add date
            </button>
          </div>

          <TimelineView
            employees={employees}
            dates={dates}
            cells={cells}
            timelineDate={timelineDate && dates.includes(timelineDate) ? timelineDate : (dates.find((d) => !isWeekend(d)) || dates[0])}
            setTimelineDate={setTimelineDate}
            teamColor={teamColor}
            setEditing={setEditing}
            removeDate={removeDate}
            removeEmployee={removeEmployee}
            timeOffDates={data.timeOffDates || []}
          />
        </>
      )}

      {tab === "overview" && (
        <OverviewTab employees={employees} dates={dates} cells={cells} coverageStats={coverageStats} ibCoverageStats={ibCoverageStats} />
      )}

      {tab === "timeoff" && (
        <div className="p-4 sm:p-6">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <div className="flex items-center gap-1.5">
              <select
                value={logPickerEmp}
                onChange={(e) => setLogPickerEmp(e.target.value)}
                className="text-xs bg-white border border-slate-300 rounded-full px-3 py-1.5 text-slate-700"
              >
                <option value="">Log time off for…</option>
                {employees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
              </select>
              <button
                onClick={() => {
                  if (!logPickerEmp) return;
                  setLogTimeOff(logPickerEmp); setLogDate(""); setLogType("PTO"); setLogScope("allday"); setLogStart("09:00"); setLogEnd("17:00"); setLogHours("8"); setLogCoveredBy("");
                }}
                disabled={!logPickerEmp}
                className="th-btn-primary transition-colors text-xs px-3 py-1.5 rounded-full text-white font-medium disabled:opacity-40 disabled:cursor-not-allowed"
              >
                Log time off
              </button>
            </div>
            <div className="flex items-center gap-1 rounded-full border p-0.5" style={{ borderColor: TH.border }}>
              {[{ id: "dates", label: "By Date" }, { id: "grid", label: "Grid" }].map((v) => (
                <button
                  key={v.id}
                  onClick={() => setTimeOffView(v.id)}
                  className="text-xs px-3 py-1 rounded-full font-semibold transition-colors"
                  style={timeOffView === v.id ? { backgroundColor: TH.navy, color: "#fff" } : { color: TH.textMid }}
                >
                  {v.label}
                </button>
              ))}
            </div>
          </div>

          {timeOffView === "grid" ? (
            <div className="mb-8">
              {(() => {
                const allGridDates = Array.from(new Set([...dates, ...datesThroughEOY(), ...(data.timeOffDates || []).map((e) => e.date)])).sort();
                const pastGridDates = allGridDates.filter((d) => d < todayISO);
                const upcomingGridDates = allGridDates.filter((d) => d >= todayISO);
                const visibleGridDates = showPastGrid ? allGridDates : upcomingGridDates;
                return (
                  <>
                    {pastGridDates.length > 0 && (
                      <button
                        onClick={() => setShowPastGrid((v) => !v)}
                        className="flex items-center gap-1 text-xs px-2.5 py-1 rounded border border-slate-300 text-slate-600 hover:bg-slate-50 mb-2 font-medium"
                      >
                        {showPastGrid ? "▾" : "▸"} {showPastGrid ? "Hide" : "Show"} {pastGridDates.length} past date{pastGridDates.length === 1 ? "" : "s"}
                      </button>
                    )}
                    <div className="overflow-auto border border-slate-200 rounded-lg" style={{ maxHeight: "70vh" }}>
                      <table className="border-collapse text-sm min-w-full">
                        <thead>
                          <tr>
                            <th className="sticky left-0 top-0 z-20 bg-white border-b border-r border-slate-200 px-3 py-2 text-left text-xs text-slate-500 font-mono min-w-[140px]">Care Advocate</th>
                            {visibleGridDates.map((d) => {
                              const peopleOut = tdPeopleByDate[d] ? tdPeopleByDate[d].size : 0;
                              const dOverlap = peopleOut >= 2;
                              const isPast = d < todayISO;
                              return (
                                <th
                                  key={d}
                                  className={`sticky top-0 z-10 border-b px-2 py-2 text-center text-xs font-mono min-w-[110px] ${dOverlap ? "bg-amber-50 border-amber-200 text-amber-800" : isPast ? "bg-slate-50 border-slate-200 text-slate-400" : "bg-white border-slate-200 text-slate-700"}`}
                                  title={dOverlap ? `${peopleOut} people out this day` : undefined}
                                >
                                  {fmtDate(d)}
                                  {dOverlap && (
                                    <span className="flex items-center justify-center gap-0.5 mt-0.5 text-[9px] font-semibold">
                                      <AlertTriangle className="w-2.5 h-2.5" /> {peopleOut}
                                    </span>
                                  )}
                                </th>
                              );
                            })}
                          </tr>
                        </thead>
                        <tbody>
                          {employees.map((emp, i) => (
                            <tr key={emp.id} className={i % 2 ? "bg-slate-50" : "bg-white"}>
                              <td className="sticky left-0 z-10 px-3 py-2 text-sm text-slate-900 border-r border-slate-200" style={{ backgroundColor: i % 2 ? "#f8fafc" : "#fff" }}>{emp.name}</td>
                              {visibleGridDates.map((d) => {
                                const entry = (data.timeOffDates || []).find((e) => e.empId === emp.id && e.date === d);
                                const dOverlap = tdPeopleByDate[d] && tdPeopleByDate[d].size >= 2;
                                const flagged = entry && dOverlap;
                                const isPast = d < todayISO;
                                return (
                                  <td key={d} className={`px-1.5 py-1.5 border-b text-center ${dOverlap ? "border-amber-100 bg-amber-50/40" : isPast ? "border-slate-100 bg-slate-50/50" : "border-slate-100"}`}>
                                    <select
                                      value={entry ? entry.label : ""}
                                      onChange={(ev) => setTimeOffCell(emp.id, d, ev.target.value)}
                                      title={flagged ? `${tdPeopleByDate[d].size} people out this day` : "Approved/Sick/LoA/Floating Holiday also set the Schedule status; Flex doesn't"}
                                      className={`w-full text-[10px] rounded border px-1 py-1 ${flagged ? "bg-amber-100 text-amber-900 border-amber-300 font-semibold" : entry ? "bg-indigo-50 text-indigo-800 border-indigo-200" : "bg-white border-slate-200 text-slate-400"}`}
                                    >
                                      <option value="">—</option>
                                      {["Approved", "Sick", "Flex", "LoA", "Floating Holiday"].map((l) => <option key={l} value={l}>{l}</option>)}
                                    </select>
                                  </td>
                                );
                              })}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </>
                );
              })()}
            </div>
          ) : (
          <>
          {(() => {
            const byDate = {};
            (data.timeOffDates || []).forEach((entry) => {
              (byDate[entry.date] = byDate[entry.date] || []).push(entry);
            });
            const renderGroup = (sortedDates, isLast) => sortedDates.map((date, i) => {
              const entries = byDate[date];
              const distinctPeople = new Set(entries.map((e) => e.empId)).size;
              const overlap = distinctPeople >= 2;
              const lastRow = i === sortedDates.length - 1;
              return (
                <div key={date} className="relative flex gap-3 px-3 py-2.5">
                  <div className="flex flex-col items-center w-3 pt-0.5 flex-shrink-0">
                    <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${overlap ? "bg-amber-500" : "bg-slate-300"}`} />
                    {!lastRow && <span className="w-px flex-1 bg-slate-200 mt-1" />}
                  </div>
                  <div className="flex-1 pb-1">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs font-mono text-slate-700 font-semibold">{fmtDate(date)}</span>
                      {overlap && (
                        <span className="flex items-center gap-1 text-[10px] px-1.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-medium">
                          <AlertTriangle className="w-3 h-3" /> {distinctPeople} out
                        </span>
                      )}
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {entries.map((entry) => {
                        const emp = employees.find((e) => e.id === entry.empId);
                        return (
                          <span key={entry.id} className="flex items-center gap-1.5 text-xs px-2 py-1 rounded-full border bg-white border-slate-200 shadow-sm">
                            <span className="font-medium text-slate-900">{emp ? emp.name : entry.empId}</span>
                            <span className="text-[10px] px-1.5 py-0.5 rounded-full bg-indigo-50 text-indigo-800">{entry.label}</span>
                            <button onClick={() => removeTimeOffDate(entry.id)} className="text-slate-400 hover:text-rose-500"><X className="w-3 h-3" /></button>
                          </span>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            });
            const upcoming = Object.keys(byDate).filter((d) => d >= todayISO).sort();
            const past = Object.keys(byDate).filter((d) => d < todayISO).sort().reverse();
            return (
              <>
                <h3 className="text-xs font-mono text-slate-500 mb-1.5 uppercase tracking-wide">Upcoming</h3>
                <div className="border border-slate-200 rounded-lg bg-slate-50/60 py-1 mb-4">
                  {upcoming.length === 0
                    ? <div className="px-3 py-4 text-xs text-slate-400 italic">No upcoming dated entries.</div>
                    : renderGroup(upcoming)}
                </div>
                <button
                  onClick={() => setShowPastList((v) => !v)}
                  className="flex items-center gap-1 text-xs px-2.5 py-1 rounded border border-slate-300 text-slate-600 hover:bg-slate-50 mb-1.5 font-medium"
                >
                  {showPastList ? "▾" : "▸"} Past — {past.length} entr{past.length === 1 ? "y" : "ies"} kept for history
                </button>
                {showPastList && (
                  <div className="border border-slate-200 rounded-lg bg-slate-50/60 py-1 mb-3 opacity-90">
                    {past.length === 0
                      ? <div className="px-3 py-4 text-xs text-slate-400 italic">No past dated entries yet.</div>
                      : renderGroup(past)}
                  </div>
                )}
              </>
            );
          })()}
          <div className="flex flex-wrap gap-2 mb-8">
            <select value={newTdEmp} onChange={(e) => setNewTdEmp(e.target.value)} className="bg-white border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900">
              <option value="">Person…</option>
              {employees.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}
            </select>
            <input type="date" value={newTdDate} onChange={(e) => setNewTdDate(e.target.value)} className="bg-white border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900" />
            <select value={newTdLabel} onChange={(e) => setNewTdLabel(e.target.value)} title="Approved/Sick/LoA/Floating Holiday also set the Schedule status; Flex doesn't" className="bg-white border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900">
              {["Approved", "Sick", "Flex", "LoA", "Floating Holiday"].map((l) => <option key={l} value={l}>{l}</option>)}
            </select>
            <button
              onClick={() => {
                if (!newTdEmp || !newTdDate) return;
                addTimeOffDate({ id: `td${Date.now()}`, empId: newTdEmp, date: newTdDate, label: newTdLabel });
                setNewTdEmp(""); setNewTdDate(""); setNewTdLabel("Approved");
              }}
              className="th-btn-primary transition-colors text-xs px-3 py-1.5 rounded text-white font-medium"
            >
              Add
            </button>
          </div>
          </>
          )}
        </div>
      )}

      {tab === "ptoeval" && (
        <PtoEvalTab
          employees={employees.filter((e) => !e.partTime)}
          timeOff={timeOff}
          notes={data.ptoEvalNotes || {}}
          updateNote={updatePtoNote}
          updateTimeOff={updateTimeOff}
        />
      )}

      {tab === "scorecard" && (
        <CaScorecardTab
          employees={employees}
          qaEvals={data.qaEvals || {}}
          updateQaEvalBatch={updateQaEvalBatch}
        />
      )}

      {tab === "caeval" && (
        <CaEvalTab
          employees={employees}
          qaEvals={data.qaEvals || {}}
          updateQaEval={updateQaEval}
          updateEmployee={updateEmployee}
        />
      )}

      {tab === "holidays" && (
        <HolidaysTab
          holidays={holidays}
          nameOptions={employees.filter((e) => (e.status || "Active") === "Active").map((e) => e.name).sort()}
          updateHolidayField={updateHolidayField}
          updateMetric={updateMetric}
          addVolunteer={addVolunteer}
          removeVolunteer={removeVolunteer}
          updateVolunteer={updateVolunteer}
          holidayView={holidayView}
          setHolidayView={setHolidayView}
        />
      )}

      {/* Edit cell modal */}
      {editing && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={() => setEditing(null)}>
          <div className="bg-white border border-slate-300 rounded-lg w-full max-w-md max-h-[85vh] overflow-y-auto p-5" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <div>
                <h3 className="text-sm font-semibold text-slate-900">{editEmp?.name}</h3>
                <p className="text-xs text-slate-500 font-mono">{fmtDate(editing.date)}</p>
              </div>
              <button onClick={() => setEditing(null)} className="text-slate-500 hover:text-slate-900"><X className="w-4 h-4" /></button>
            </div>

            {(data.timeOffDates || []).some((td) => td.empId === editing.empId && td.date === editing.date) && (
              <div className="flex items-center gap-2 text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded px-3 py-2 mb-4">
                <AlertTriangle className="w-3.5 h-3.5 shrink-0" />
                Time off is logged for this person on this date (Time Off tab) — make sure what you set here matches.
              </div>
            )}

            {(() => {
              const blocks = editCell.blocks || [];
              const hasWorking = blocks.some((b) => b.type === "Working");
              const isAllDay = (b) => !b.start && !b.end;

              const addBlock = () => {
                const empStart = editEmp?.shiftStart || "09:00";
                const empEnd = editEmp?.shiftEnd || "17:00";
                const last = blocks[blocks.length - 1];
                // A second-or-later block always gets explicit times — "all day" only makes
                // sense when it's the ONLY thing happening that day.
                updateBlocks(editing.empId, editing.date, [
                  ...blocks.map((b) => isAllDay(b) ? { ...b, start: b.type === "Working" ? empStart : "09:00", end: b.type === "Working" ? empEnd : "17:00" } : b),
                  { id: `blk${Date.now()}`, type: "Working", start: last?.end || empStart, end: empEnd },
                ]);
              };
              const patchBlock = (id, patch) => updateBlocks(editing.empId, editing.date, blocks.map((b) => (b.id === id ? { ...b, ...patch } : b)));
              const removeBlock = (id) => updateBlocks(editing.empId, editing.date, blocks.filter((b) => b.id !== id));

              return (
                <>
                  <label className="block text-xs text-slate-500 mb-2">Blocks for today</label>
                  <div className="space-y-2 mb-2">
                    {blocks.map((b) => (
                      <div key={b.id} className="border border-slate-200 rounded-lg p-2.5">
                        <div className="flex items-center gap-2 mb-2">
                          <select
                            value={b.type}
                            onChange={(e) => patchBlock(b.id, { type: e.target.value })}
                            className="text-xs font-mono border border-slate-300 rounded px-1.5 py-1.5 bg-white text-slate-900"
                          >
                            {BLOCK_TYPES.map((t) => <option key={t} value={t}>{blockLabel(t)}</option>)}
                          </select>
                          {blocks.length === 1 && (
                            <label className="flex items-center gap-1 text-[10px] text-slate-500 shrink-0 cursor-pointer">
                              <input
                                type="checkbox"
                                checked={isAllDay(b)}
                                onChange={(e) => patchBlock(b.id, e.target.checked
                                  ? { start: "", end: "" }
                                  : { start: b.type === "Working" ? (editEmp?.shiftStart || "09:00") : "09:00", end: b.type === "Working" ? (editEmp?.shiftEnd || "17:00") : "17:00" })}
                                className="accent-teal-600"
                              />
                              All day
                            </label>
                          )}
                          {blocks.length > 1 && (
                            <button onClick={() => removeBlock(b.id)} className="text-slate-400 hover:text-rose-600 ml-auto shrink-0" title="Remove this block">
                              <Trash2 className="w-3.5 h-3.5" />
                            </button>
                          )}
                        </div>
                        {!isAllDay(b) && (
                          <div className="flex items-center gap-2 mb-2">
                            <input type="time" value={b.start} onChange={(e) => patchBlock(b.id, { start: e.target.value })}
                              className="flex-1 bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900" />
                            <span className="text-slate-400 text-xs">–</span>
                            <input type="time" value={b.end} onChange={(e) => patchBlock(b.id, { end: e.target.value })}
                              className="flex-1 bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900" />
                          </div>
                        )}
                        {b.type !== "Working" && b.type !== "NotScheduled" && (
                          <div className="border-t border-slate-100 pt-2">
                            <label className="flex items-center gap-1.5 text-[11px] text-slate-600 cursor-pointer mb-1.5">
                              <input
                                type="checkbox"
                                checked={!!b.coveredBy || b._showCoverPicker}
                                onChange={(e) => patchBlock(b.id, e.target.checked ? { _showCoverPicker: true } : { coveredBy: "", _showCoverPicker: false })}
                                className="accent-teal-600"
                              />
                              Covered?
                            </label>
                            {(b.coveredBy || b._showCoverPicker) && (
                              <select
                                value={b.coveredBy || ""}
                                onChange={(e) => patchBlock(b.id, { coveredBy: e.target.value })}
                                className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900"
                              >
                                <option value="">Who's covering?</option>
                                {employees.filter((e) => e.id !== editing.empId).map((e) => (
                                  <option key={e.id} value={e.name}>{e.name}</option>
                                ))}
                              </select>
                            )}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                  <button
                    onClick={addBlock}
                    className="w-full text-xs px-3 py-2 rounded-full border border-dashed border-slate-300 text-slate-500 hover:border-teal-500 hover:text-teal-700 flex items-center justify-center gap-1.5 mb-4"
                  >
                    <Plus className="w-3.5 h-3.5" /> Add another block
                  </button>

                  {hasWorking && (
                    <>
                      <label className="block text-xs text-slate-500 mb-1.5">Skills — each can be all day or specific hours</label>
                      <div className="mb-4">
                        <TaskBuilder
                          tasks={editCell.tasks}
                          onAddBatch={(newTasks) => addTasks(editing.empId, editing.date, newTasks)}
                          onRemove={(taskId) => removeTask(editing.empId, editing.date, taskId)}
                          functionOptions={functionOptions}
                        />
                      </div>
                    </>
                  )}
                </>
              );
            })()}

            <div className="border-t border-slate-200 pt-3 mb-4">
              <div className="flex items-center justify-between mb-1.5">
                <label className="block text-xs text-slate-500">Copy this day to other days</label>
                <div className="flex gap-2">
                  <button onClick={() => setCopyToDates(dates.filter((d) => d !== editing.date))} className="text-[10px] font-medium" style={{ color: TH.tealDark }}>All</button>
                  <button onClick={() => setCopyToDates([])} className="text-[10px] text-slate-400 font-medium">Clear</button>
                </div>
              </div>
              <div className="grid grid-cols-4 gap-1 mb-2 max-h-24 overflow-auto pr-1">
                {dates.filter((d) => d !== editing.date).map((d) => (
                  <label key={d} className="flex items-center gap-1 text-[10px] text-slate-600 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={copyToDates.includes(d)}
                      onChange={() => setCopyToDates((prev) => prev.includes(d) ? prev.filter((x) => x !== d) : [...prev, d])}
                      className="accent-teal-600"
                    />
                    {fmtDate(d)}
                  </label>
                ))}
              </div>
              <button
                disabled={copyToDates.length === 0}
                onClick={() => { copyCellToDates(editing.empId, editing.date, copyToDates); setCopyToDates([]); }}
                className="w-full text-xs px-3 py-1.5 rounded-full border border-slate-300 text-slate-700 hover:border-teal-500 hover:text-teal-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
              >
                Copy to {copyToDates.length || ""} day{copyToDates.length === 1 ? "" : "s"}
              </button>
            </div>

            <button onClick={() => setEditing(null)} className="th-btn-primary transition-colors w-full flex items-center justify-center gap-2 text-sm px-3 py-2 rounded text-white font-medium">
              <Save className="w-3.5 h-3.5" /> Done
            </button>
          </div>
        </div>
      )}

      {/* Add employee modal */}
      {addingEmp && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={() => setAddingEmp(false)}>
          <div className="bg-white border border-slate-300 rounded-lg w-full max-w-sm max-h-[85vh] overflow-y-auto p-5" onClick={(e) => e.stopPropagation()}>
            <h3 className="text-sm font-semibold text-slate-900 mb-4">Add employee</h3>
            <input autoFocus value={newEmpName} onChange={(e) => setNewEmpName(e.target.value)} placeholder="Full name"
              className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900 mb-2" />
            <input value={newEmpTeam} onChange={(e) => setNewEmpTeam(e.target.value)} placeholder="Team (optional)"
              className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900 mb-4" />
            <div className="flex gap-2">
              <button onClick={() => setAddingEmp(false)} className="flex-1 text-sm px-3 py-2 rounded border border-slate-300 text-slate-700">Cancel</button>
              <button onClick={addEmployee} className="th-btn-primary transition-colors flex-1 text-sm px-3 py-2 rounded text-white font-medium">Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Add date modal */}
      {addingDate && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={() => setAddingDate(false)}>
          <div className="bg-white border border-slate-300 rounded-lg w-full max-w-sm max-h-[85vh] overflow-y-auto p-5" onClick={(e) => e.stopPropagation()}>
            <h3 className="text-sm font-semibold text-slate-900 mb-4">Add date</h3>
            <input autoFocus type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)}
              className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900 mb-4" />
            <div className="flex gap-2">
              <button onClick={() => setAddingDate(false)} className="flex-1 text-sm px-3 py-2 rounded border border-slate-300 text-slate-700">Cancel</button>
              <button onClick={addDate} className="th-btn-primary transition-colors flex-1 text-sm px-3 py-2 rounded text-white font-medium">Add</button>
            </div>
          </div>
        </div>
      )}

      {/* Log time off modal */}
      {logTimeOff && (
        <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={() => { setLogTimeOff(null); setLogPickerEmp(""); }}>
          <div className="bg-white border border-slate-300 rounded-lg w-full max-w-sm max-h-[85vh] overflow-y-auto p-5" onClick={(e) => e.stopPropagation()}>
            <h3 className="text-sm font-semibold text-slate-900 mb-4">
              Log time off — {employees.find((e) => e.id === logTimeOff)?.name}
            </h3>
            <label className="block text-xs text-slate-500 mb-1.5">Date</label>
            <input autoFocus type="date" value={logDate} onChange={(e) => setLogDate(e.target.value)}
              className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900 mb-4" />
            <label className="block text-xs text-slate-500 mb-1.5">Type</label>
            <div className="flex flex-wrap gap-2 mb-4">
              {["PTO", "Sick", "Holiday", "FloatingHoliday", "LOA"].map((t) => (
                <button key={t} onClick={() => setLogType(t)}
                  className={`text-xs px-2.5 py-1 rounded border font-mono ${logType === t ? "border-teal-500 text-teal-700 bg-teal-50" : "border-slate-300 text-slate-500"}`}>
                  {STATUS[t]?.label || t}
                </button>
              ))}
            </div>

            <label className="block text-xs text-slate-500 mb-1.5">When</label>
            <div className="mb-1">
              <ScopeToggle
                scope={logScope} start={logStart} end={logEnd}
                onChange={({ scope, start, end }) => { setLogScope(scope); setLogStart(start); setLogEnd(end); }}
              />
            </div>
            {logScope !== "partial" && (
              <>
                <label className="block text-xs text-slate-500 mb-1.5 mt-2">Hours</label>
                <HourPicker value={logHours} onChange={setLogHours} />
              </>
            )}
            {(logType === "PTO" || logType === "Sick") && (
              <p className="text-[11px] text-slate-500 mt-1 mb-4">
                {logScope === "partial"
                  ? `${(parseFloat(hoursBetween(logStart, logEnd) || 0) / 8).toFixed(2)} day(s) will be deducted from upcoming ${logType}.`
                  : (logHours ? `${(parseFloat(logHours) / 8).toFixed(2)} day(s) will be deducted from upcoming ${logType}.` : "Enter hours to auto-deduct from the upcoming balance.")}
              </p>
            )}
            {!(logType === "PTO" || logType === "Sick") && <div className="mb-4" />}

            <label className="block text-xs text-slate-500 mb-1.5">Shift covered by</label>
            <select
              value={logCoveredBy} onChange={(e) => setLogCoveredBy(e.target.value)}
              className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-sm text-slate-900 mb-4"
            >
              <option value="">No coverage assigned</option>
              {employees.filter((e) => e.id !== logTimeOff).map((e) => (
                <option key={e.id} value={e.name}>{e.name}</option>
              ))}
            </select>

            <div className="flex gap-2">
              <button onClick={() => { setLogTimeOff(null); setLogPickerEmp(""); }} className="flex-1 text-sm px-3 py-2 rounded border border-slate-300 text-slate-700">Cancel</button>
              <button onClick={submitLogTimeOff} className="th-btn-primary transition-colors flex-1 text-sm px-3 py-2 rounded text-white font-medium">Save</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<ManagerSchedule />);
</script>
</body>
</html>
