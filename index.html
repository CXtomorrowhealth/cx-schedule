function CaScorecardTab({ employees, qaEvals, updateQaEvalBatch }) {
  const [selectedMonth, setSelectedMonth] = useState(currentMonthKey());
  const [csvFiles, setCsvFiles] = useState({ tickets: null, productivity: null, qa: null, hist: null });
  const [csvRows, setCsvRows] = useState({ tickets: null, productivity: null, qa: null, hist: null });
  const [csvError, setCsvError] = useState(null);
  const [preview, setPreview] = useState(null); // { patches: {empId: patch}, unmatched: [names], included: {empId: bool} }
  const [genResult, setGenResult] = useState(null); // { matched: [names] } — shown after Accept
  const [pdfBusy, setPdfBusy] = useState(false);
  const [pdfError, setPdfError] = useState(null);

  const handleCsvFile = (type, file) => {
    if (!file) return;
    setCsvError(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      const rows = parseScorecardCSV(e.target.result);
      if (!rows.length) { setCsvError(`Couldn't read rows out of that ${type} CSV — check it has a header row plus data.`); return; }
      setCsvRows((prev) => ({ ...prev, [type]: rows }));
      setCsvFiles((prev) => ({ ...prev, [type]: file.name }));
    };
    reader.readAsText(file);
  };

  const clearCsvs = () => {
    setCsvFiles({ tickets: null, productivity: null, qa: null, hist: null });
    setCsvRows({ tickets: null, productivity: null, qa: null, hist: null });
    setPreview(null);
    setGenResult(null);
    setCsvError(null);
  };

  // Step 1: parse + match, but don't save anything yet — the manager reviews first.
  const buildPreview = () => {
    setCsvError(null);
    setGenResult(null);
    if (!csvRows.tickets && !csvRows.productivity && !csvRows.qa && !csvRows.hist) {
      setCsvError("Upload at least one CSV first.");
      return;
    }
    const { results, unmatched } = matchScorecardCSVs(
      { ticketsRows: csvRows.tickets, productivityRows: csvRows.productivity, qaRows: csvRows.qa, histRows: csvRows.hist },
      employees
    );
    const patches = {};
    const included = {};
    Object.entries(results).forEach(([empId, vals]) => {
      const emp = employees.find((e) => e.id === empId);
      if (!emp) return;
      const patch = {};
      if (vals.tickets != null) patch.tickets = vals.tickets;
      if (vals.availablePct != null) patch.availablePct = vals.availablePct;
      if (vals.acw != null) patch.acw = vals.acw;
      if (vals.qa != null) patch.qa = vals.qa;
      if (vals.hist) patch.hist = vals.hist;
      if (vals.qaTickets && vals.qaTickets.length) {
        const coachNotes = vals.qaTickets.map((t) => t.coachingNote).filter(Boolean);
        if (coachNotes.length) patch.qaTicketNotes = coachNotes;
      }
      patches[empId] = patch;
      included[empId] = true;
    });
    setPreview({ patches, unmatched, included });
  };

  // Step 2: manager clicks Accept — only rows still checked get written to this month's record.
  const acceptPreview = () => {
    if (!preview) return;
    const patches = {};
    const matchedNames = [];
    Object.entries(preview.patches).forEach(([empId, patch]) => {
      if (!preview.included[empId]) return;
      const emp = employees.find((e) => e.id === empId);
      if (!emp) return;
      matchedNames.push(emp.name);
      patches[empId] = patch;
    });
    if (Object.keys(patches).length) updateQaEvalBatch(selectedMonth, patches);
    setGenResult({ matched: matchedNames });
    setPreview(null);
  };

  const discardPreview = () => setPreview(null);

  const handleDownloadPdf = async () => {
    setPdfError(null);
    setPdfBusy(true);
    try {
      await downloadScorecardPdf(employees, qaEvals, selectedMonth);
    } catch (e) {
      setPdfError(e.message || "Couldn't generate the PDF.");
    } finally {
      setPdfBusy(false);
    }
  };

  const UploadCard = ({ type, label, hint }) => (
    <label className={`flex-1 min-w-[150px] border-2 rounded-lg px-3 py-4 text-center cursor-pointer transition-colors ${csvFiles[type] ? "border-teal-500 bg-teal-50" : "border-dashed border-slate-300 hover:border-teal-400"}`}>
      <input type="file" accept=".csv" className="hidden" onChange={(e) => handleCsvFile(type, e.target.files[0])} />
      <div className="text-xs font-semibold text-slate-700">{label}</div>
      <div className={`text-[10px] mt-1 ${csvFiles[type] ? "text-teal-700 font-medium" : "text-slate-400"}`}>
        {csvFiles[type] || hint}
      </div>
    </label>
  );

  const acceptedThisMonth = employees.filter((e) => qaEvals[e.id]?.[selectedMonth]).length;
  const allMonthsWithData = [...new Set(employees.flatMap((e) => Object.keys(qaEvals[e.id] || {})))].sort();

  return (
    <div className="p-4 sm:p-6">
      <div className="flex items-center gap-2 mb-4">
        <button onClick={() => setSelectedMonth((m) => shiftMonthKey(m, -1))} className="w-7 h-7 rounded border border-slate-300 text-slate-500 hover:border-slate-400 flex items-center justify-center">‹</button>
        <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{ backgroundColor: TH.navy, color: "#fff" }}>{monthKeyLabel(selectedMonth)}</span>
        <button onClick={() => setSelectedMonth((m) => shiftMonthKey(m, 1))} className="w-7 h-7 rounded border border-slate-300 text-slate-500 hover:border-slate-400 flex items-center justify-center">›</button>
        {selectedMonth !== currentMonthKey() && (
          <button onClick={() => setSelectedMonth(currentMonthKey())} className="text-[11px] text-slate-500 hover:text-slate-700 underline ml-1">Jump to current month</button>
        )}
        <span className="text-[11px] text-slate-400 font-mono ml-auto">{acceptedThisMonth}/{employees.length} accepted for this month</span>
      </div>

      <div className="border border-slate-200 rounded-lg p-4 mb-6 bg-slate-50/60">
        <div className="flex items-center justify-between mb-3">
          <h2 className="text-xs font-mono text-slate-500 uppercase tracking-wide">Generate {monthKeyLabel(selectedMonth)} from CSVs</h2>
          {(csvFiles.tickets || csvFiles.productivity || csvFiles.qa || csvFiles.hist) && (
            <button onClick={clearCsvs} className="text-[11px] text-slate-500 hover:text-slate-700 underline">Clear</button>
          )}
        </div>
        <div className="flex flex-wrap gap-2 mb-3">
          <UploadCard type="tickets" label="Tickets per hour" hint="CSV — name + tickets/avail hr" />
          <UploadCard type="productivity" label="Productivity" hint="CSV — Available/ACW pivot" />
          <UploadCard type="qa" label="QA scores" hint="CSV — 3-ticket pivot" />
          <UploadCard type="hist" label="Historical metrics" hint="CSV — email + call stats" />
        </div>
        {csvError && <div className="text-xs text-rose-600 mb-2">{csvError}</div>}
        {!preview && (
          <button
            onClick={buildPreview}
            disabled={!csvRows.tickets && !csvRows.productivity && !csvRows.qa && !csvRows.hist}
            className="th-btn-primary transition-colors text-xs px-4 py-2 rounded text-white font-medium disabled:opacity-40 disabled:cursor-not-allowed"
          >
            Preview scorecards for {monthKeyLabel(selectedMonth)}
          </button>
        )}
        {genResult && (
          <div className="mt-3 text-xs text-teal-700 font-medium">
            Accepted and saved to {monthKeyLabel(selectedMonth)} for {genResult.matched.length}: {genResult.matched.join(", ")}. Switch to the CA Eval tab to see the analysis.
          </div>
        )}

        {preview && (
          <div className="mt-3 border border-slate-200 rounded-lg bg-white p-3">
            <div className="text-xs text-slate-600 mb-2">
              Review before saving — uncheck anyone you don't want to accept this into {monthKeyLabel(selectedMonth)} for. Nothing is saved until you click Accept.
            </div>
            {preview.unmatched.length > 0 && (
              <div className="text-xs text-amber-700 mb-2">Couldn't match to anyone on the roster: {preview.unmatched.join(", ")}</div>
            )}
            <div className="overflow-auto mb-3">
              <table className="min-w-full text-xs">
                <thead>
                  <tr className="text-[10px] font-mono text-slate-500">
                    <th className="text-left px-2 py-1">Include</th>
                    <th className="text-left px-2 py-1">Name</th>
                    <th className="text-right px-2 py-1">Tickets/hr</th>
                    <th className="text-right px-2 py-1">Available %</th>
                    <th className="text-right px-2 py-1">ACW %</th>
                    <th className="text-right px-2 py-1">QA %</th>
                    <th className="text-left px-2 py-1">Hist. metrics</th>
                  </tr>
                </thead>
                <tbody>
                  {Object.entries(preview.patches).map(([empId, patch], i) => {
                    const emp = employees.find((e) => e.id === empId);
                    if (!emp) return null;
                    return (
                      <tr key={empId} className={i % 2 ? "bg-slate-50" : "bg-white"}>
                        <td className="px-2 py-1">
                          <input type="checkbox" checked={!!preview.included[empId]}
                            onChange={(e) => setPreview((p) => ({ ...p, included: { ...p.included, [empId]: e.target.checked } }))} />
                        </td>
                        <td className="px-2 py-1 text-slate-800 whitespace-nowrap">{emp.name}</td>
                        <td className="px-2 py-1 text-right font-mono text-slate-600">{patch.tickets ?? "—"}</td>
                        <td className="px-2 py-1 text-right font-mono text-slate-600">{patch.availablePct ?? "—"}</td>
                        <td className="px-2 py-1 text-right font-mono text-slate-600">{patch.acw ?? "—"}</td>
                        <td className="px-2 py-1 text-right font-mono text-slate-600">{patch.qa ?? "—"}</td>
                        <td className="px-2 py-1 text-slate-500">{patch.hist ? "✓" : "—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="flex gap-2">
              <button onClick={acceptPreview} className="th-btn-primary transition-colors text-xs px-4 py-2 rounded text-white font-medium">
                Accept &amp; save to {monthKeyLabel(selectedMonth)}
              </button>
              <button onClick={discardPreview} className="text-xs px-4 py-2 rounded border border-slate-300 text-slate-600 hover:bg-slate-50">
                Discard
              </button>
            </div>
          </div>
        )}
      </div>

      <div className="border border-slate-200 rounded-lg p-4 bg-white">
        <h2 className="text-xs font-mono text-slate-500 uppercase tracking-wide mb-2">Export</h2>
        <button
          onClick={handleDownloadPdf}
          disabled={pdfBusy || acceptedThisMonth === 0}
          className="flex items-center gap-1.5 text-xs px-4 py-2 rounded border border-slate-300 text-slate-700 hover:border-teal-500 hover:text-teal-700 disabled:opacity-40 disabled:cursor-not-allowed"
        >
          <Download className="w-3.5 h-3.5" /> {pdfBusy ? "Building PDF…" : `Download PDF — ${monthKeyLabel(selectedMonth)}`}
        </button>
        {acceptedThisMonth === 0 && <p className="text-[11px] text-slate-400 mt-1.5">Accept at least one entry for this month first.</p>}
        {pdfError && <p className="text-xs text-rose-600 mt-1.5">{pdfError}</p>}
      </div>
    </div>
  );
}

function CaEvalTab({ employees, qaEvals, updateQaEval, updateEmployee }) {
  const numOrNull = (v) => (v === "" || v == null ? null : parseFloat(v));
  const avg = (arr) => (arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : null);

  const [selectedMonth, setSelectedMonth] = useState(currentMonthKey());
  const [openHistory, setOpenHistory] = useState({}); // empId -> bool

  // This month's values across the team — used for the team stat cards and for the
  // percentile-based "Overall" comparison, which is always relative to this same month.
  // Anyone marked ticketsExempt (e.g. on project time, not regular ticket volume) is left out
  // of the tickets array entirely — their number shouldn't drag the team average around either.
  const monthOf = (empId) => qaEvals[empId]?.[selectedMonth] || {};
  const allTickets = employees.filter((e) => !e.ticketsExempt).map((e) => numOrNull(monthOf(e.id).tickets)).filter((v) => v != null);
  const allAvail = employees.map((e) => numOrNull(monthOf(e.id).availablePct)).filter((v) => v != null);
  const allQa = employees.map((e) => numOrNull(monthOf(e.id).qa)).filter((v) => v != null);
  const avgTickets = avg(allTickets), avgAvail = avg(allAvail), avgQaVal = avg(allQa);

  // Every month anyone has an entry for, for the "jump to month" list.
  const allMonthsWithData = [...new Set(employees.flatMap((e) => Object.keys(qaEvals[e.id] || {})))].sort();

  // Precompute each person's eval so the list can be sorted by who needs attention first —
  // lowest Overall score at the top, no-data-yet people at the bottom (nothing to review).
  const evaluated = employees.map((emp) => {
    const empMonths = qaEvals[emp.id] || {};
    const raw = empMonths[selectedMonth] || {};
    const ev = {
      tickets: emp.ticketsExempt ? null : numOrNull(raw.tickets),
      availablePct: numOrNull(raw.availablePct),
      acw: numOrNull(raw.acw),
      qa: numOrNull(raw.qa),
    };
    const overall = qaOverallScore(ev, allTickets, allAvail, allQa);
    const label = qaOverallLabel(overall);
    const { highlights, improvements, coaching } = analyzeCaEval(ev, avgQaVal);
    return { emp, empMonths, raw, ev, overall, label, highlights, improvements, coaching };
  });
  const sortedEvaluated = [...evaluated].sort((a, b) => {
    if (a.overall == null && b.overall == null) return a.emp.name.localeCompare(b.emp.name);
    if (a.overall == null) return 1;
    if (b.overall == null) return -1;
    return a.overall - b.overall; // ascending — needs work first
  });

  return (
    <div className="p-4 sm:p-6">
      <div className="flex items-center gap-2 mb-4">
        <button onClick={() => setSelectedMonth((m) => shiftMonthKey(m, -1))} className="w-7 h-7 rounded border border-slate-300 text-slate-500 hover:border-slate-400 flex items-center justify-center">‹</button>
        <span className="text-sm font-semibold px-3 py-1 rounded-full" style={{ backgroundColor: TH.navy, color: "#fff" }}>{monthKeyLabel(selectedMonth)}</span>
        <button onClick={() => setSelectedMonth((m) => shiftMonthKey(m, 1))} className="w-7 h-7 rounded border border-slate-300 text-slate-500 hover:border-slate-400 flex items-center justify-center">›</button>
        {selectedMonth !== currentMonthKey() && (
          <button onClick={() => setSelectedMonth(currentMonthKey())} className="text-[11px] text-slate-500 hover:text-slate-700 underline ml-1">Jump to current month</button>
        )}
        {allMonthsWithData.length > 0 && (
          <select
            value={selectedMonth}
            onChange={(e) => setSelectedMonth(e.target.value)}
            className="text-[11px] bg-white border border-slate-300 rounded px-2 py-1 text-slate-600 ml-auto"
          >
            {[...new Set([...allMonthsWithData, selectedMonth])].sort().map((m) => (
              <option key={m} value={m}>{monthKeyLabel(m)}</option>
            ))}
          </select>
        )}
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
        <div className="rounded-lg p-3" style={{ backgroundColor: TH.navy }}>
          <div className="text-[10px] uppercase tracking-wide text-white/50 mb-1">Avg tickets/hr</div>
          <div className="text-xl font-semibold text-white">{avgTickets != null ? avgTickets.toFixed(2) : "—"}</div>
          <div className="text-[10px] text-white/40 mt-0.5">benchmark {CA_TICKET_BENCHMARK}</div>
        </div>
        <div className="rounded-lg p-3" style={{ backgroundColor: TH.navy }}>
          <div className="text-[10px] uppercase tracking-wide text-white/50 mb-1">Avg available %</div>
          <div className="text-xl font-semibold text-white">{avgAvail != null ? avgAvail.toFixed(1) + "%" : "—"}</div>
          <div className="text-[10px] text-white/40 mt-0.5">target &gt;{CA_AVAIL_GOOD}%</div>
        </div>
        <div className="rounded-lg p-3" style={{ backgroundColor: TH.navy }}>
          <div className="text-[10px] uppercase tracking-wide text-white/50 mb-1">Avg QA score</div>
          <div className="text-xl font-semibold text-white">{avgQaVal != null ? avgQaVal.toFixed(1) + "%" : "—"}</div>
          <div className="text-[10px] text-white/40 mt-0.5">100 = perfect</div>
        </div>
        <div className="rounded-lg p-3" style={{ backgroundColor: TH.navy }}>
          <div className="text-[10px] uppercase tracking-wide text-white/50 mb-1">Entries this month</div>
          <div className="text-xl font-semibold text-white">{employees.filter((e) => qaEvals[e.id]?.[selectedMonth]).length}/{employees.length}</div>
          <div className="text-[10px] text-white/40 mt-0.5">of the roster</div>
        </div>
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {sortedEvaluated.map(({ emp, empMonths, raw, ev, overall, label, highlights, improvements, coaching }) => {
          // Running average across every month this person has any entry for.
          const monthKeys = Object.keys(empMonths).sort();
          const avgField = (field) => {
            const vals = monthKeys.map((m) => numOrNull(empMonths[m]?.[field])).filter((v) => v != null);
            return vals.length ? avg(vals) : null;
          };
          const runningAvg = { tickets: avgField("tickets"), availablePct: avgField("availablePct"), acw: avgField("acw"), qa: avgField("qa") };
          const monthsTracked = monthKeys.filter((m) => {
            const v = empMonths[m];
            return v && (v.tickets != null || v.availablePct != null || v.acw != null || v.qa != null);
          }).length;

          const MetricTile = ({ metricKey, value, onChange, suffix, disabled }) => (
            <div className={`rounded-lg border p-2 text-center ${metricTierClasses(metricKey, value, emp)}`}>
              <div className="flex items-center justify-center gap-0.5">
                <input
                  type="number" step={metricKey === "tickets" ? "0.01" : "0.1"}
                  value={value ?? ""} onChange={onChange} disabled={disabled}
                  className="w-12 bg-transparent text-lg font-bold text-center outline-none placeholder-current"
                  placeholder="—"
                />
                {value != null && suffix && <span className="text-xs font-semibold">{suffix}</span>}
              </div>
              <div className="text-[9px] font-mono uppercase tracking-wide opacity-70 mt-0.5">{METRIC_TILE_LABELS[metricKey]}</div>
            </div>
          );

          return (
            <div key={emp.id} className="border border-slate-200 rounded-lg bg-white p-3.5 flex flex-col">
              <div className="flex items-start justify-between gap-2 mb-2.5">
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-900 truncate">{emp.name}</div>
                  <div className="text-[10px] text-slate-500 font-mono">{emp.team}</div>
                </div>
                <span className={`text-[10px] px-1.5 py-0.5 rounded border font-medium whitespace-nowrap shrink-0 ${QA_OVERALL_TONE[label.tone]}`}>{label.text.split(" · ")[0]}</span>
              </div>

              <div className="grid grid-cols-4 gap-1.5 mb-2.5">
                <MetricTile metricKey="tickets" value={ev.tickets} disabled={!!emp.ticketsExempt}
                  onChange={(e) => updateQaEval(emp.id, selectedMonth, "tickets", e.target.value)} />
                <MetricTile metricKey="availablePct" value={ev.availablePct} suffix="%"
                  onChange={(e) => updateQaEval(emp.id, selectedMonth, "availablePct", e.target.value)} />
                <MetricTile metricKey="acw" value={ev.acw} suffix="%"
                  onChange={(e) => updateQaEval(emp.id, selectedMonth, "acw", e.target.value)} />
                <MetricTile metricKey="qa" value={ev.qa} suffix="%"
                  onChange={(e) => updateQaEval(emp.id, selectedMonth, "qa", e.target.value)} />
              </div>

              <label className="flex items-center gap-1 mb-2 text-[10px] text-slate-500 cursor-pointer">
                <input type="checkbox" checked={!!emp.ticketsExempt} onChange={(e) => updateEmployee(emp.id, "ticketsExempt", e.target.checked)} className="accent-teal-500" />
                Project time — don't score tickets
              </label>

              <button
                onClick={() => setOpenHistory((p) => ({ ...p, [emp.id]: !p[emp.id] }))}
                className="text-[11px] text-teal-700 hover:text-teal-900 font-medium text-left mt-auto pt-1"
              >
                {openHistory[emp.id] ? "▾ Hide details" : "▸ Details"}{monthsTracked > 0 ? ` (${monthsTracked}mo avg: ${runningAvg.qa != null ? runningAvg.qa.toFixed(0) + "% QA" : "—"})` : ""}
              </button>

              {openHistory[emp.id] && (
                <div className="mt-2.5 pt-2.5 border-t border-slate-100">
                  <div className="text-[11px] text-slate-600 mb-2">
                    <span className="font-semibold text-slate-700">Avg across {monthsTracked} month{monthsTracked === 1 ? "" : "s"}:</span>{" "}
                    {runningAvg.tickets != null ? `${runningAvg.tickets.toFixed(2)} tickets/hr` : "—"} ·{" "}
                    {runningAvg.availablePct != null ? `${runningAvg.availablePct.toFixed(1)}% avail` : "—"} ·{" "}
                    {runningAvg.acw != null ? `${runningAvg.acw.toFixed(1)}% ACW` : "—"} ·{" "}
                    {runningAvg.qa != null ? `${runningAvg.qa.toFixed(1)}% QA` : "—"}
                  </div>

                  {monthKeys.length > 1 && (
                    <div className="overflow-auto mb-3 border border-slate-200 rounded">
                      <table className="min-w-full text-xs">
                        <thead className="bg-slate-50">
                          <tr className="text-[10px] font-mono text-slate-500">
                            <th className="text-left px-2 py-1.5">Month</th>
                            <th className="text-right px-2 py-1.5">Tickets/hr</th>
                            <th className="text-right px-2 py-1.5">Available %</th>
                            <th className="text-right px-2 py-1.5">ACW %</th>
                            <th className="text-right px-2 py-1.5">QA %</th>
                          </tr>
                        </thead>
                        <tbody>
                          {monthKeys.map((m, i) => (
                            <tr key={m} className={i % 2 ? "bg-slate-50" : "bg-white"}>
                              <td className="px-2 py-1 text-slate-700 whitespace-nowrap">{monthKeyLabel(m)}</td>
                              <td className="px-2 py-1 text-right font-mono text-slate-600">{empMonths[m]?.tickets ?? "—"}</td>
                              <td className="px-2 py-1 text-right font-mono text-slate-600">{empMonths[m]?.availablePct ?? "—"}</td>
                              <td className="px-2 py-1 text-right font-mono text-slate-600">{empMonths[m]?.acw ?? "—"}</td>
                              <td className="px-2 py-1 text-right font-mono text-slate-600">{empMonths[m]?.qa ?? "—"}</td>
                            </tr>
                          ))}
                          <tr className="border-t-2 border-slate-300 font-semibold">
                            <td className="px-2 py-1 text-slate-700">Average</td>
                            <td className="px-2 py-1 text-right font-mono text-slate-700">{runningAvg.tickets != null ? runningAvg.tickets.toFixed(2) : "—"}</td>
                            <td className="px-2 py-1 text-right font-mono text-slate-700">{runningAvg.availablePct != null ? runningAvg.availablePct.toFixed(1) : "—"}</td>
                            <td className="px-2 py-1 text-right font-mono text-slate-700">{runningAvg.acw != null ? runningAvg.acw.toFixed(1) : "—"}</td>
                            <td className="px-2 py-1 text-right font-mono text-slate-700">{runningAvg.qa != null ? runningAvg.qa.toFixed(1) : "—"}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  )}

                  {(highlights.length > 0 || improvements.length > 0 || coaching.length > 0) && (
                    <div className="space-y-2 mb-3">
                      {highlights.length > 0 && (
                        <div>
                          <div className="text-[10px] font-semibold uppercase tracking-wide text-teal-700 mb-1">Highlights</div>
                          <ul className="space-y-1">
                            {highlights.map((h, i) => (
                              <li key={i} className="text-xs text-slate-700 flex gap-1.5"><span className="text-teal-500 mt-0.5">•</span>{h}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                      {improvements.length > 0 && (
                        <div>
                          <div className="text-[10px] font-semibold uppercase tracking-wide text-rose-700 mb-1">Areas for improvement</div>
                          <ul className="space-y-1">
                            {improvements.map((h, i) => (
                              <li key={i} className="text-xs text-slate-700 flex gap-1.5"><span className="text-rose-500 mt-0.5">•</span>{h}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                      {coaching.length > 0 && (
                        <div>
                          <div className="text-[10px] font-semibold uppercase tracking-wide text-sky-700 mb-1">Coaching notes</div>
                          <ul className="space-y-1">
                            {coaching.map((h, i) => (
                              <li key={i} className="text-xs text-slate-700 flex gap-1.5"><span className="text-sky-500 mt-0.5">•</span>{h}</li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )}

                  {raw.qaTicketNotes && raw.qaTicketNotes.length > 0 && (
                    <div className="mb-3">
                      <div className="text-[10px] font-semibold uppercase tracking-wide text-slate-500 mb-1">From the QA CSV (per-ticket coaching notes)</div>
                      <ul className="space-y-1">
                        {raw.qaTicketNotes.map((n, i) => (
                          <li key={i} className="text-xs text-slate-500 italic flex gap-1.5"><span className="mt-0.5">•</span>{n}</li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {raw.hist && (
                    <div className="mb-3 pt-2 border-t border-slate-100">
                      <div className="text-[10px] font-semibold uppercase tracking-wide text-slate-500 mb-1.5">Performance metrics (from historical CSV)</div>
                      <div className="grid grid-cols-2 gap-1.5">
                        {raw.hist.answerRate && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Answer rate</span><strong className="text-slate-700">{raw.hist.answerRate}</strong></div>
                        )}
                        {raw.hist.inbound && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Inbound calls</span><strong className="text-slate-700">{raw.hist.inbound}</strong></div>
                        )}
                        {raw.hist.outbound && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Outbound calls</span><strong className="text-slate-700">{raw.hist.outbound}</strong></div>
                        )}
                        {raw.hist.onHold && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Times on hold</span><strong className="text-slate-700">{raw.hist.onHold}</strong></div>
                        )}
                        {raw.hist.avgHandleTime && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Avg handle time</span><strong className="text-slate-700">{scorecardFmtSec(raw.hist.avgHandleTime)}</strong></div>
                        )}
                        {raw.hist.contactsMissed && (
                          <div className="flex justify-between text-[11px] text-slate-500"><span>Contacts missed</span><strong className="text-slate-700">{raw.hist.contactsMissed}</strong></div>
                        )}
                      </div>
                    </div>
                  )}

                  <textarea
                    value={raw.notes || ""}
                    onChange={(e) => updateQaEval(emp.id, selectedMonth, "notes", e.target.value)}
                    placeholder={`Manager notes for ${monthKeyLabel(selectedMonth)} (optional)…`}
                    rows={2}
                    className="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-xs text-slate-900 resize-none"
                  />
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function HolidaysTab({ holidays, nameOptions, updateHolidayField, updateMetric, addVolunteer, removeVolunteer, updateVolunteer, holidayView, setHolidayView }) {
  const [showPastHolidays, setShowPastHolidays] = useState(false);
  const upcoming = holidays.filter((h) => daysUntil(h.date) >= 0);
  const past = holidays.filter((h) => daysUntil(h.date) < 0).sort((a, b) => b.date.localeCompare(a.date));
  const cardProps = { nameOptions, updateHolidayField, updateMetric, addVolunteer, removeVolunteer, updateVolunteer };
  const tableProps = { nameOptions, updateHolidayField, updateMetric, addVolunteer, removeVolunteer, updateVolunteer };

function HolidayTable({ holidays, title, muted, nameOptions, updateHolidayField, updateMetric, addVolunteer, removeVolunteer, updateVolunteer }) {
  const [newVol, setNewVol] = useState({}); // holidayId -> { name, start, end }
  const setNewVolField = (holidayId, field, value) =>
    setNewVol((p) => ({ ...p, [holidayId]: { ...(p[holidayId] || {}), [field]: value } }));
  const submitVol = (holidayId) => {
    const v = newVol[holidayId] || {};
    if (!v.name || !v.name.trim()) return;
    addVolunteer(holidayId, { id: `v${Date.now()}`, name: v.name.trim(), start: v.start || "", end: v.end || "" });

  };

  return (
    <div className="mb-6">
      <h2 className={`text-xs font-mono mb-2 uppercase tracking-wide ${muted ? "text-slate-500" : "text-teal-700"}`}>{title}</h2>
      <div className={`overflow-auto border border-slate-200 rounded-lg ${muted ? "opacity-80" : ""}`}>
        <table className="min-w-full text-sm">

            <tr className="text-[11px] font-mono text-slate-500">

              <th className="text-left px-2 py-2">Date</th>
              <th className="text-left px-2 py-2">Team Lead</th>
              <th className="text-left px-2 py-2 min-w-[220px]">Volunteers</th>
              <th className="text-center px-2 py-2">MOC</th>
              <th className="text-center px-2 py-2">IB</th>
              <th className="text-center px-2 py-2">Orders</th>
              <th className="text-center px-2 py-2">Urgents</th>
              <th className="text-center px-2 py-2">Faxes</th>
            </tr>
          </thead>
          <tbody>

                  <td className="px-2 py-2 text-slate-600 font-mono text-xs whitespace-nowrap align-top">{fmtDate(h.date)}</td>

                      className="w-24 text-xs bg-white border border-slate-200 rounded px-1.5 py-1 text-slate-700 placeholder-slate-400"
                    />
                  </td>
                  <td className="px-2 py-2 align-top">
                    <div className="space-y-1 mb-1.5">
                      {volunteers.map((v) => (
                        <div key={v.id} className="flex items-center gap-1 text-xs bg-white border border-slate-200 rounded px-1.5 py-1">
                          <input
                            list={`holiday-names-${h.id}`}
                            value={v.name}

                          />
                          <input type="time" value={v.start || ""} onChange={(e) => updateVolunteer(h.id, v.id, "start", e.target.value)}

                          <input type="time" value={v.end || ""} onChange={(e) => updateVolunteer(h.id, v.id, "end", e.target.value)}

                    </div>

                    <input type="checkbox" checked={!!h.metrics?.mocComplete} onChange={(e) => updateMetric(h.id, "mocComplete", e.target.checked)} className="accent-teal-500" />
